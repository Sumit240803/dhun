name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # The ledger's guarantees live in triggers, deferred constraints and row
      # locks. A mocked database would prove nothing, so CI runs the real thing.
      # PostgreSQL 17 to match local; the schema needs 15+ for NULLS NOT DISTINCT.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: liveapp
          POSTGRES_PASSWORD: liveapp
          POSTGRES_DB: liveapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liveapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The room bus and the gateway's fan-out are Redis pub/sub. Without this
      # service every rooms-live and gateway test failed on ECONNREFUSED — the
      # reason CI was red on every push until 2026-10-23.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Everything the local .env supplies that a test depends on. The defaults
    # are deliberately the UNCONFIGURED ones (EMAIL_PROVIDER=none fails loudly
    # on the first send), which is right for a deploy and wrong for a test run.
    env:
      DATABASE_URL: postgres://liveapp:liveapp@localhost:5432/liveapp_test
      TEST_DATABASE_URL: postgres://liveapp:liveapp@localhost:5432/liveapp_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
      RAZORPAY_KEY_SECRET: razorpay-test-secret
      EMAIL_PROVIDER: console
      OTP_PROVIDER: console
      IAP_PROVIDER: stub
      PUSH_PROVIDER: console
      # The widget tests stub MSG91 over HTTP; the service still has to believe
      # it holds a server credential, or it answers 503 before the stub is hit.
      MSG91_AUTH_KEY: ci-only-msg91-authkey
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # globalSetup rebuilds the schema from migrations, so this also proves
        # every migration applies cleanly from scratch.
        run: npm test

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    env:
      # Required by config/env.ts, which validates at import and throws when
      # absent — deliberately, so a misconfigured build fails loudly.
      EXPO_PUBLIC_API_URL: http://localhost:3000
      EXPO_PUBLIC_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Includes the colour rules: a hardcoded hex fails the build, which is
        # what makes the token system a single source of truth rather than a
        # convention people drift away from.
        run: npx expo lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  # The deploy builds this image from every green main. Building it here too,
  # on every push and PR, means a broken Dockerfile or a file the compiled
  # layout cannot find is caught before merge, not at deploy time.
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t dhun-backend:ci backend/
      - name: Every process mode starts its entrypoint
        run: |
          code=0
          docker run --rm dhun-backend:ci nonsense || code=$?
          if [ "$code" -ne 64 ]; then echo "::error::unknown command should exit 64, got $code"; exit 1; fi
          docker run --rm --entrypoint sh dhun-backend:ci -c 'test -f build/src/server.js && test -f build/src/gateway/index.js && test -f build/src/workers/index.js && test -f build/scripts/migrate.js && test -d build/migrations && test -d build/public && test -f build/ops/roles.sql && command -v psql'

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: Format
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validate
        run: |
          for root in global envs/staging envs/prod; do
            terraform -chdir="infra/$root" init -backend=false -input=false >/dev/null
            terraform -chdir="infra/$root" validate
          done

  # Cheap guard against the mistake that is expensive to undo: a committed .env.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no environment files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|staging)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "No environment files tracked."
