# Local dev dependencies. Postgres 16 is the floor — the ledger schema uses
# UNIQUE NULLS NOT DISTINCT (PG15+) and partitioned-table features.
services:
  postgres:
    image: postgres:16-alpine
    container_name: liveapp-postgres
    environment:
      POSTGRES_USER: liveapp
      POSTGRES_PASSWORD: liveapp
      POSTGRES_DB: liveapp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liveapp']
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database for the test suite, so `npm test` never touches dev data.
  postgres-test:
    image: postgres:16-alpine
    container_name: liveapp-postgres-test
    environment:
      POSTGRES_USER: liveapp
      POSTGRES_PASSWORD: liveapp
      POSTGRES_DB: liveapp_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data # in-memory: fast, wiped between runs
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liveapp']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: liveapp-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
